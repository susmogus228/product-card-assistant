[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "product-card-assistant"
version = "0.1.0"
description = "Source-grounded drafts of B2B product cards using Groq"
requires-python = ">=3.12"
dependencies = ["groq==1.7.0", "httpx==0.28.1", "pydantic==2.14.2", "python-dotenv==1.2.4"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[project.scripts]
product-card = "product_card.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --basetemp=work/pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
